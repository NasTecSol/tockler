appId: 'com.nastecsol.nova'
productName: 'Nova'
buildVersion: '4.0.29'
asar: true
asarUnpack:
    - scripts
    - shared
    - '**/node_modules/better-sqlite3/**'
    - '**/node_modules/active-win/**'

npmRebuild: false

directories:
    output: 'packaged'
files:
    - 'dist-electron/**/*'
    - 'package.json'
    - 'shared/**/*'

publish:
    - github

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlement.mac.plist
  entitlementsInherit: build/entitlement.mac.plist
  minimumSystemVersion: '12.0'
  x64ArchFiles: '{**/node_modules/**/*.node,**/node_modules/active-win/main}'

afterSign: notarize.js

mas:
    entitlements: './build/entitlement.mas.plist'
    entitlementsInherit: './build/entitlement.mas.inherit.plist'
    type: distribution
    provisioningProfile: embedded.provisionprofile
    minimumSystemVersion: '12.0'
    target:
        - target: mas
          arch:
              - universal

win:
    artifactName: ${name}-${version}-portable-${os}-${arch}.${ext}
    electronUpdaterCompatibility: '>=2.16.0'
    target:
        - target: nsis
          arch:
              - x64
              - ia32
              - arm64
        - target: portable
          arch:
              - x64
              - ia32
              - arm64

nsis:
    artifactName: ${name}-${version}-setup-${os}-${arch}.${ext}
    oneClick: false
    allowToChangeInstallationDirectory: true
    differentialPackage: false

linux:
    category: Utility
    electronUpdaterCompatibility: '>=2.16.0'
    target:
        - AppImage

snap:
    confinement: devmode
    assumes:
        - common-data-dir
        - command-chain
    layout:
        /usr/bin/xprop:
            bind-file: $SNAP/xprop
        /usr/bin/xwininfo:
            bind-file: $SNAP/xwininfo

dmg:
    sign: false

protocols:
    name: Nova
    schemes:
        - nova