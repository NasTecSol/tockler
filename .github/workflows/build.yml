name: Build Windows and Linux

on:
    push:
        branches:
            - deployment
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - deployment

# Fix Node.js 24 deprecation warning
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build (${{ matrix.os }}-${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    # ✅ Linux only
                    - os: ubuntu-latest
                      arch: x64
                    # ✅ Windows only
                    - os: windows-latest
                      arch: x64

        steps:
            # ─────────────────────────────────────────
            # 1. Checkout
            # ─────────────────────────────────────────
            - name: Checkout
              uses: actions/checkout@v4

            # ─────────────────────────────────────────
            # 2. Node.js
            # ─────────────────────────────────────────
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            # ─────────────────────────────────────────
            # 3. pnpm (v4 fixes Node.js 24 warning)
            # ─────────────────────────────────────────
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
                  run_install: false

            # ─────────────────────────────────────────
            # 4. Package version
            # ─────────────────────────────────────────
            - name: Get Package Version
              shell: bash
              run: |
                  echo "PACKAGE_VERSION=$(node -p -e "require('./electron/package.json').version")" >> $GITHUB_ENV

            # ─────────────────────────────────────────
            # 5. Python (required for native modules)
            # ─────────────────────────────────────────
            - name: Install Python Setuptools on Ubuntu
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y python3-setuptools

            - name: Install Python Setuptools on Windows
              if: matrix.os == 'windows-latest'
              run: |
                  python -m pip install --upgrade pip
                  pip install setuptools

            # ─────────────────────────────────────────
            # 6. Install Dependencies
            # ─────────────────────────────────────────
            - name: Install Dependencies (Electron)
              shell: bash
              run: |
                  cd electron
                  pnpm install
                  cd ..

            - name: Install Dependencies (Client)
              run: |
                  cd client
                  pnpm install
                  cd ..

            # ─────────────────────────────────────────
            # 7. Build Client (Vite)
            # ─────────────────────────────────────────
            - name: Build Client
              env:
                  VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}
                  VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
                  VITE_USER_ID: ${{ secrets.VITE_USER_ID }}
              run: |
                  cd client
                  pnpm build
                  cd ..

            # ─────────────────────────────────────────
            # 8. Create .env
            # ─────────────────────────────────────────
            - name: Create .env file
              shell: bash
              run: |
                  cd electron
                  echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
                  cd ..

            # ─────────────────────────────────────────
            # 9. Build Electron (Windows / Linux only)
            #    No Mac signing needed here
            # ─────────────────────────────────────────
            - name: Build Electron App
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd electron
                  export ELECTRON_BUILDER_SILENT=true
                  pnpm build
                  pnpm prepare_client
                  if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
                    pnpm release -- --win
                  elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
                    pnpm release -- --linux
                  fi
                  cd ..

            # ─────────────────────────────────────────
            # 10. Upload build artifacts
            # ─────────────────────────────────────────
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: ${{ matrix.os }}-${{ matrix.arch }}-build
                  path: |
                      electron/packaged/*.AppImage
                      electron/packaged/*.deb
                      electron/packaged/*.rpm
                      electron/packaged/*.exe
                      electron/packaged/*.msi
                  retention-days: 7