name: Deploy to Mac App Store

on:
  push:
    branches:
      - deployment
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to App Store (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Get Package Version
        shell: bash
        run: echo "PACKAGE_VERSION=$(node -p -e "require('./electron/package.json').version")" >> $GITHUB_ENV

      - name: Install Python Setuptools on MacOS-13
        if: matrix.os == 'macos-13'
        run: |
          python3 -m pip install setuptools
          echo "PYTHON=$(which python3)" >> $GITHUB_ENV
          echo "npm_config_python=$(which python3)" >> $GITHUB_ENV

      - name: Install Python Setuptools on other macOS
        if: startsWith(matrix.os, 'macos') && matrix.os != 'macos-13'
        run: brew install python-setuptools

      - name: Configure node-gyp for MacOS-13
        if: matrix.os == 'macos-13'
        run: |
          cd electron
          echo "node-gyp-binary=python3" >> .npmrc
          echo "python=python3" >> .npmrc
          echo "npm_config_python=python3" >> .npmrc
          cd ..

      - name: Install Dependencies (Electron)
        shell: bash
        run: |
          cd electron
          if [[ "${{ matrix.os }}" == "macos-13" ]]; then
            PYTHON=$(which python3) pnpm install
          else
            pnpm install
          fi
          cd ..

      - name: Install Dependencies (Client)
        run: |
          cd client
          pnpm install
          cd ..

      - name: Build Client
        env:
          VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}
          VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
          VITE_USER_ID: ${{ secrets.VITE_USER_ID }}
        run: |
          cd client
          pnpm build
          cd ..

      - name: Create .env file
        shell: bash
        run: |
          cd electron
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          cd ..

      - name: Import Apple Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          # ✅ Using secret, not hardcoded value
          p12-file-base64: ${{ secrets.APPSTORE_P12_CERT }}
          p12-password: ${{ secrets.APPSTORE_P12_PASSWORD }}

      - name: Import Provisioning Profile
        run: |
          # ✅ Using secret, not hardcoded expired value
          echo "${{ secrets.APPSTORE_PROVISIONING_PROFILE }}" | base64 --decode \
            > electron/embedded.provisionprofile

      - name: Build and Package Electron App (MAS)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: |
          cd electron
          export ELECTRON_BUILDER_SILENT=true
          pnpm build
          pnpm prepare_client
          pnpm release --mac mas --${{ matrix.arch }}
          cd ..

      - name: Upload to App Store Connect
        # ✅ Using APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD (no API keys needed)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          PKG_PATH=$(find electron/packaged -name "*.pkg" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: No .pkg file found in electron/packaged"
            exit 1
          fi
          echo "Found package: $PKG_PATH"

          echo "Validating..."
          xcrun altool --validate-app \
            -f "$PKG_PATH" \
            -t macos \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Uploading to App Store Connect..."
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Upload complete!"