name: Deploy to Mac App Store

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to App Store (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Get Package Version
        id: package_version
        shell: bash
        run: echo "PACKAGE_VERSION=$(node -p -e "require('./electron/package.json').version")" >> $GITHUB_ENV

      - name: Install Python Setuptools on MacOS-13
        if: matrix.os == 'macos-13'
        run: |
          python3 -m pip install setuptools
          echo "PYTHON=$(which python3)" >> $GITHUB_ENV
          echo "npm_config_python=$(which python3)" >> $GITHUB_ENV

      - name: Install Python Setuptools on other macOS
        if: startsWith(matrix.os, 'macos') && matrix.os != 'macos-13'
        run: brew install python-setuptools

      - name: Configure node-gyp for MacOS-13
        if: matrix.os == 'macos-13'
        run: |
          cd electron
          echo "node-gyp-binary=python3" >> .npmrc
          echo "python=python3" >> .npmrc
          echo "npm_config_python=python3" >> .npmrc
          cd ..

      - name: Install Dependencies (Electron)
        shell: bash
        run: |
          cd electron
          if [[ "${{ matrix.os }}" == "macos-13" ]]; then
            PYTHON=$(which python3) pnpm install
          else
            pnpm install
          fi
          cd ..

      - name: Install Dependencies (Client)
        run: |
          cd client
          pnpm install
          cd ..

      - name: Build Client
        env:
          VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}
          VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
          VITE_USER_ID: ${{ secrets.VITE_USER_ID }}
        run: |
          cd client
          pnpm build
          cd ..

      - name: Create .env file
        shell: bash
        run: |
          cd electron
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          cd ..

      - name: Import Apple Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: 
          p12-password: ${{ secrets.APPSTORE_P12_PASSWORD }}

      - name: Import Provisioning Profile
        run: |
          # Write the provisioning profile to the location expected by electron-builder
          echo "" | base64 --decode > electron/embedded.provisionprofile

      - name: Build and Package Electron App (MAS)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ensure electron-builder auto-discovers certificates from the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: |
          cd electron
          export ELECTRON_BUILDER_SILENT=true
          pnpm build
          pnpm prepare_client
          
          # Target 'mas' builds the .pkg installer file
          pnpm release --mac mas --${{ matrix.arch }}
          cd ..

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # Write the private key (.p8) to the directory that xcrun altool expects
          mkdir -p ~/.private_keys
          echo "$API_KEY_CONTENT" > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
          
          # Find the generated .pkg file under electron/packaged
          PKG_PATH=$(find electron/packaged -name "*.pkg" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: No .pkg file found in electron/packaged"
            exit 1
          fi
          echo "Found package to upload: $PKG_PATH"
          
          # Validate package before uploading
          echo "Validating package with App Store Connect..."
          xcrun altool --validate-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
            
          # Upload package
          echo "Uploading package to App Store Connect..."
          xcrun altool --upload-package \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean up Keys
        if: always()
        run: |
          rm -f ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 || true
